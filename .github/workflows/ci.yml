name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go security suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        # actions/checkout v4 resolved and verified by the prior green run.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go 1.27.3
        # actions/setup-go v5 resolved and verified by the prior green run.
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
          cache: false

      - name: Validate shell scripts
        shell: bash
        run: |
          bash -n scripts/test-live.sh
          bash -n scripts/install.sh

      - name: Smoke test native Linux installer and failed-upgrade safety
        shell: bash
        run: |
          set -euo pipefail
          install_home="$(mktemp -d)"
          wrapper_dir="$(mktemp -d)"
          trap 'rm -rf -- "$install_home" "$wrapper_dir"' EXIT
          real_go="$(command -v go)"
          go_path="$(go env GOPATH)"
          go_mod_cache="$(go env GOMODCACHE)"

          HOME="$install_home" GOPATH="$go_path" GOMODCACHE="$go_mod_cache" ./scripts/install.sh
          installed="$install_home/.local/bin/mirage"
          expected_commit="$(git rev-parse HEAD)"
          metadata="$("$installed" version --json)"
          grep -Fq '"version":"1.0.0"' <<< "$metadata"
          grep -Fq "\"commit\":\"$expected_commit\"" <<< "$metadata"
          grep -Fq '"bridge_protocol":1' <<< "$metadata"
          grep -Fq '"platform":"linux"' <<< "$metadata"
          test "$(stat -c '%a' "$installed")" = "755"

          cat > "$wrapper_dir/go" <<'FAKE_GO'
          #!/usr/bin/env bash
          set -euo pipefail
          for arg in "$@"; do
            if [[ "$arg" == "build" && "$MIRAGE_TEST_FAIL_BUILD" == "1" ]]; then
              echo "simulated Go build failure for installer regression test" >&2
              exit 42
            fi
          done
          exec "$REAL_GO" "$@"
          FAKE_GO
          chmod 0755 "$wrapper_dir/go"

          before="$(sha256sum "$installed" | cut -d ' ' -f 1)"
          if PATH="$wrapper_dir:$PATH" REAL_GO="$real_go" MIRAGE_TEST_FAIL_BUILD=1 HOME="$install_home" GOPATH="$go_path" GOMODCACHE="$go_mod_cache" ./scripts/install.sh; then
            echo "installer unexpectedly succeeded with a forced build failure" >&2
            exit 1
          fi
          after="$(sha256sum "$installed" | cut -d ' ' -f 1)"
          test "$before" = "$after"
          stage_left="$(find "$install_home/.local/bin" -maxdepth 1 -name '.mirage-stage.*' -print -quit)"
          test -z "$stage_left"

      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'gofmt required for:\n%s\n' "$unformatted"
            while IFS= read -r file; do
              [ -n "$file" ] && gofmt -d "$file"
            done <<< "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -count=1 -cover ./...

  windows-cli:
    name: Windows CLI frontend
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go 1.27.3
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
          cache: false

      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/install.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            throw ($errors | Format-List * | Out-String)
          }

      - name: Test frontend packages
        run: go test -count=1 ./cmd/mirage ./internal/platform/wsl

      - name: Build Windows frontend
        run: go build -o mirage.exe ./cmd/mirage

      - name: Build Linux backend artifact
        shell: pwsh
        run: |
          $env:GOOS = 'linux'
          $env:GOARCH = 'amd64'
          go build -o mirage-linux-amd64 ./cmd/mirage
