name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go security suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        # actions/checkout v4 resolved and verified by the prior green run.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go 1.27.3
        # actions/setup-go v5 resolved and verified by the prior green run.
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
          cache: false

      - name: Validate shell scripts
        shell: bash
        run: |
          bash -n scripts/test-live.sh
          bash -n scripts/install.sh

      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'gofmt required for:\n%s\n' "$unformatted"
            while IFS= read -r file; do
              [ -n "$file" ] && gofmt -d "$file"
            done <<< "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -count=1 -cover ./...

  windows-cli:
    name: Windows CLI frontend
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go 1.27.3
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
          cache: false

      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/install.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            throw ($errors | Format-List * | Out-String)
          }

      - name: Test frontend packages
        run: go test -count=1 ./cmd/mirage ./internal/platform/wsl

      - name: Build Windows frontend
        run: go build -o mirage.exe ./cmd/mirage

      - name: Build Linux backend artifact
        shell: pwsh
        run: |
          $env:GOOS = 'linux'
          $env:GOARCH = 'amd64'
          go build -o mirage-linux-amd64 ./cmd/mirage
